<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockdesk · Scan diagnostics</title><style>body{font:16px system-ui;background:#101a28;color:#e5edf5;margin:32px auto;max-width:1150px;padding:0 20px}a{color:#73ddd3}h1{font-size:30px}p{color:#b8c9d9}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px;border-bottom:1px solid #344256;vertical-align:top}th{color:#73ddd3}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#summary{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.card{background:#203247;padding:16px;border-radius:8px}button{padding:10px 16px;cursor:pointer}</style><a href="/">← Dashboard</a><h1>Scan diagnostics</h1><p>Each stock shows its first blocking stage. Later checks may not have run. Option counts show each contract’s first rejection.</p><button onclick="load()">Refresh</button><p id="status">Loading…</p><div id="summary"></div><table><thead><tr><th>Symbol</th><th>Outcome</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table><script>
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
async function load(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('Could not load status');const s=await r.json();document.getElementById('status').textContent=s.status+' · '+(s.scanned||0)+' / '+(s.total||0)+' processed · '+(s.completed_at||'No completed scan');const ds=s.diagnostics||[];const counts={};for(const d of ds)counts[d.outcome]=(counts[d.outcome]||0)+1;const summary=document.getElementById('summary');summary.replaceChildren();for(const [k,v] of Object.entries(counts)){const n=el('div',v+' · '+k);n.className='card';summary.append(n)}const rows=document.getElementById('rows');rows.replaceChildren();if(!ds.length){summary.append(el('p','No diagnostics recorded yet. Run a new scan during market hours.'));}for(const d of ds){const tr=document.createElement('tr');tr.append(el('td',d.symbol),el('td',d.outcome));const td=document.createElement('td');const detail={...d};delete detail.symbol;delete detail.outcome;td.append(el('pre',JSON.stringify(detail,null,2)));tr.append(td);rows.append(tr)}}catch(e){document.getElementById('status').textContent=e.message}}
// Show demand subreasons without changing each stock's first-blocking outcome.
const originalLoad=load;
const diagnosticsBuild=document.createElement('p');document.getElementById('status').after(diagnosticsBuild);
const fetchStateForBuild=async()=>{try{const r=await fetch('/api/state');if(!r.ok)return;const s=await r.json();diagnosticsBuild.textContent='Running version: '+(s.build||'older version')+' · Last scan version: '+(s.scan_build||'older or unknown')+(s.build!==s.scan_build?' · Run a new scan after updating.':'')}catch{}};
fetchStateForBuild();setInterval(fetchStateForBuild,15000);
load=async function(){await originalLoad();const counts={};for(const pre of document.querySelectorAll('#rows pre')){try{const d=JSON.parse(pre.textContent);for(const reason of d.demand_rejections||[])counts[reason]=(counts[reason]||0)+1}catch{}}for(const [reason,count] of Object.entries(counts)){const n=el('div',count+' · Demand: '+reason);n.className='card';document.getElementById('summary').append(n)}for(const tr of document.querySelectorAll('#rows tr')){const td=tr.lastElementChild;const pre=td.querySelector('pre');if(!pre)continue;const d=JSON.parse(pre.textContent);const box=document.createElement('details');box.open=tr.children[1].textContent==='Data or processing error';box.append(el('summary',d.error||d.demand_rejections?.join('; ')||d.fundamental_rejections?.join('; ')||d.stage||'Details'),pre);td.append(box)}};
const downloadButton=el('button','Download diagnostics');
downloadButton.onclick=async()=>{downloadButton.disabled=true;try{const response=await fetch('/api/state');if(!response.ok)throw Error('Could not download diagnostics');const state=await response.json();const report={status:state.status,started_at:state.started_at,completed_at:state.completed_at,scanned:state.scanned,total:state.total,diagnostics:state.diagnostics||[],errors:state.errors||[]};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const link=el('a','Download');link.href=url;link.download='stockdesk-diagnostics.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){document.getElementById('status').textContent=e.message}finally{downloadButton.disabled=false}};
document.querySelector('button').after(downloadButton);
const loadBeforeStrategy=load;load=async function(){await loadBeforeStrategy();for(const pre of document.querySelectorAll('#rows pre')){const d=JSON.parse(pre.textContent);if(!d.swing_stage)continue;const note=el('p','Swing: '+d.swing_stage+' · '+(d.swing_blockers||[]).join('; ')+' · Put demand: '+(d.put_demand_pass?'confirmed':'unconfirmed / unchecked'));pre.parentElement.prepend(note)}};
load();setInterval(load,15000);
</script></html>
